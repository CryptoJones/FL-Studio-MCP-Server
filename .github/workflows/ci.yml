name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Guard: the README version badge must match pyproject's version, so the static
  # badge can never silently drift. Fix drift with `scripts/bump-version.sh <ver>`.
  version-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README version badge matches pyproject version
        run: |
          code=$(grep -oE '^version *= *"[0-9.]+"' pyproject.toml | grep -oE '[0-9]+(\.[0-9]+)+')
          badge=$(grep -oE 'badge/version-[0-9.]+-orange' README.md | grep -oE '[0-9]+(\.[0-9]+)+')
          echo "pyproject=$code  README badge=$badge"
          if [ -z "$code" ] || [ "$code" != "$badge" ]; then
            echo "::error::README version badge ($badge) != pyproject version ($code). Run scripts/bump-version.sh <version>."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  conformance:
    name: MCP conformance (live stdio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conformance suite
        # mcp-conformance is a private repo, so this job is a graceful no-op until
        # MCP_CONFORMANCE_TOKEN (a PAT with read access to it) is set in the repo's
        # Actions secrets. Then it boots `fl-studio-mcp` over stdio and asserts the
        # baseline 2026-07-28 contracts (see conformance.toml).
        env:
          MCP_CONFORMANCE_TOKEN: ${{ secrets.MCP_CONFORMANCE_TOKEN }}
        run: |
          if [ -z "$MCP_CONFORMANCE_TOKEN" ]; then
            echo "MCP_CONFORMANCE_TOKEN not set — skipping conformance suite."
            exit 0
          fi
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e .
          # A failed clone/install (expired PAT, no access) is a skip, not a hard
          # failure — this job is a no-op until a working token is wired up.
          if ! .venv/bin/pip install "git+https://x-access-token:${MCP_CONFORMANCE_TOKEN}@github.com/CryptoJones/mcp-conformance.git"; then
            echo "::warning::Could not install mcp-conformance (token expired or no access?) — skipping conformance suite."
            exit 0
          fi
          .venv/bin/mcp-conformance run -- -q
