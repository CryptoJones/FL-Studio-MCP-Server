[project]
name = "fl-studio-mcp-server"
version = "0.1.0"
description = "MCP server to interact with FL Studio — drive the DAW and generate/edit .flp projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.0.0,<3.0",
    "pyflp>=2.2.0",     # Route A — offline .flp read/write
]

[project.optional-dependencies]
# Route B — live control of a running FL Studio via Flapi (pulls in the FL API stubs).
live = ["flapi>=1.0", "fl-studio-api-stubs"]
test = ["pytest>=8.0"]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]
# Bundle the non-.py data files: FL's Empty template (Route A) + Piano Roll scripts (Route C).
artifacts = ["*.flp", "*.pyscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
