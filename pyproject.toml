[project]
name = "fl-studio-mcp-server"
version = "0.0.1"
description = "MCP server to interact with FL Studio — drive the DAW and generate/edit .flp projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pyflp>=2.2.0",     # Route A — offline .flp read/write
]

[project.optional-dependencies]
# Route B — live control of a running FL Studio. Flapi may need a git install; see docs/ARCHITECTURE.md.
live = ["flapi"]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]
